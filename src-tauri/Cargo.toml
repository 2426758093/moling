[package]
name = "moling"
version = "1.7.0"
description = "MoLing - AI drawing client for any API"
authors = ["MoLing Contributors"]
edition = "2021"
rust-version = "1.98"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "moling_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "multipart",
  # 企业 MITM 代理的根证书在 Windows 证书库里，webpki 内置根会直接 TLS 失败
  "rustls-tls-native-roots",
  # default-features=false 会关掉系统代理；代理设置依赖它读取系统/环境代理
  "system-proxy",
  # SOCKS5 代理（socks5 / socks5h，含远端 DNS）
  "socks",
  # 不开 gzip/brotli/deflate：自动解压一旦遇到链路谎报的 Content-Encoding，
  # 原始字节会被 reqwest 丢弃，只剩 "error decoding response body"。
  # 这里统一请求明文，解压由 adapters::mod 按魔数/头自己做
] }
# 响应体兜底解压：链路无视 Accept-Encoding: identity 强行压缩时仍能读出 JSON
flate2 = "1"
tokio = { version = "1", features = ["rt", "time"] }
aes-gcm = "0.10"
keyring = { version = "3", features = ["windows-native"] }
base64 = "0.22"
rand = "0.8"
rusqlite = { version = "0.41", features = ["bundled"] }
# 画廊缩略图：只启用光栅解码，SVG 由前端直接显示原图
image = { version = "0.25", default-features = false, features = [
  "png",
  "jpeg",
  "webp",
  "gif",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
thiserror = "2"
zip = { version = "9", default-features = false, features = ["deflate"] }
tauri-plugin-updater = "2"
# 插件 2.14 用 reqwest 0.13；configure_client 回调要求同版本类型，单独取一份别名
reqwest013 = { package = "reqwest", version = "0.13", default-features = false }
# 智能蒙版：运行时动态加载随包的 onnxruntime.dll，不在构建期下载二进制
ort = { version = "2.0.0-rc.15", features = ["load-dynamic"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
# 发版速度 vs 包体：thin LTO + 多 codegen-unit 让链接不再单线程，
# 2 核 runner 上构建时间接近减半，代价是安装包略大（strip / abort 仍保留）。
codegen-units = 16
lto = "thin"
opt-level = 3
panic = "abort"
strip = true
