[package]
name = "moling"
version = "0.4.0"
description = "MoLing - AI drawing client for any API"
authors = ["MoLing Contributors"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "moling_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "multipart",
  # 企业 MITM 代理的根证书在 Windows 证书库里，webpki 内置根会直接 TLS 失败
  "rustls-tls-native-roots",
  # default-features=false 会关掉系统代理；代理设置依赖它读取系统/环境代理
  "system-proxy",
] }
tokio = { version = "1", features = ["rt", "time"] }
aes-gcm = "0.10"
keyring = { version = "3", features = ["windows-native"] }
base64 = "0.22"
rand = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
# 画廊缩略图：只启用光栅解码，SVG 由前端直接显示原图
image = { version = "0.25", default-features = false, features = [
  "png",
  "jpeg",
  "webp",
  "gif",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
thiserror = "2"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
