# cargo-deny 配置（F-015：Rust 依赖许可 / 供应链门禁）。
#
# 位置约定：cargo-deny 从当前工作目录向上查找 deny.toml；CI 的 rust job 在
# `src-tauri/` 下执行，且 cargo-deny-action 显式传 `--manifest-path src-tauri/Cargo.toml`。
#
# 策略（勿整体放宽）：
# 1. advisories：禁止 yanked 版本；不稳定依赖（unmaintained）不阻断构建。
# 2. licenses：只允许 OSI/常见宽松与弱 copyleft 许可白名单，其余必须逐 crate 加 exception 并写理由。
# 3. bans：重复依赖只告警（Tauri 生态多版本共存常见）。
# 4. sources：只信任 crates.io，禁止 git / 本地 path 源混入。

[advisories]
# yanked：被 yank 的版本必须显式升级，直接失败
yanked = "deny"
# cargo-deny >= 0.18 把 unmaintained 从 lint 级别改为作用域（all/workspace/transitive/none），
# 已无 "warn" 取值。取 none 表示不因 unmaintained 告警阻断构建，保持与旧版 warn 一致的
# 「非阻断」语义；漏洞类 advisory 仍然一律失败。
unmaintained = "none"

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "MPL-2.0",
  "CC0-1.0",
  "Unlicense",
  "OFL-1.1",
]

[licenses.private]
# 本仓库 crate 自身尚未在 Cargo.toml 声明 license（非发布到 crates.io），只跳过私有 crate，
# 第三方依赖仍按上面的白名单检查。
ignore = true

# webpki-root-certs 打包的是 Mozilla CA 根证书数据，采用 CDLA-Permissive-2.0（数据许可，
# 不是代码许可）。只对该 crate 定向放行，避免把该许可放开给整张依赖图。
# 来源：cargo metadata 扫描 Cargo.lock 后唯一一个不在全局白名单内的许可。
[[licenses.exceptions]]
name = "webpki-root-certs"
version = "1"
allow = ["CDLA-Permissive-2.0"]

[bans]
# 多版本共存只告警，避免 Tauri / reqwest 生态升级期长期变红
multiple-versions = "warn"

[sources]
# 只信任 crates.io，任何 git / 其他 registry 源都会失败。
# 注：cargo-deny >= 0.20 已移除 sources.allow = ["crates-io"] 写法，
# 改为 allow-registry 的 URL 列表（默认即 crates.io git 索引，同时覆盖 sparse 索引）。
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
