name: Release

# 打 tag（v1.0.1 形式）触发；也可手动指定已存在的 tag 重跑。
# 发布顺序：先建空 Release → 传安装包与签名 → 最后传 latest.json。
# 反过来会出现「清单指向 404」，所有客户端检查更新立即报错。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: 已存在的 tag（形如 v1.0.1）
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    # fat LTO + codegen-units=1 在 2 核免费 runner 上首次构建可达 80 分钟以上，
    # 60 分钟会被截断；配合下方 Rust 缓存，二次构建通常 8-15 分钟。
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          build-warnings: ""

      - run: pnpm install --frozen-lockfile

      # Rust 依赖与 target 缓存：项目开了 lto=true + codegen-units=1，
      # 无缓存首次构建可能超过一小时；缓存命中后仅重编应用自身，通常 8-15 分钟。
      - name: Rust 构建缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: tauri-release

      # 发布前再跑一遍门禁：ci.yml 只在 main 上触发，tag 可能打在未过检的提交上
      - name: 质量门禁
        run: |
          pnpm lint
          pnpm format:check
          pnpm test

      # 与 ci.yml 的 rust 任务保持一致；安装包失败要等 80 分钟才暴露，代价太高
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit@0.22.2

      - name: Rust 质量门禁
        working-directory: src-tauri
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test --locked
          cargo audit

      - name: 校验 tag 与版本号一致
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          VERSION=$(node -e "console.log(JSON.parse(require('fs').readFileSync('src-tauri/tauri.conf.json','utf8')).version)")
          PKG_VERSION=$(node -e "console.log(JSON.parse(require('fs').readFileSync('package.json','utf8')).version)")
          echo "tag=$TAG version=$VERSION package.json=$PKG_VERSION"
          if [ "$VERSION" != "$PKG_VERSION" ]; then
            echo "::error::tauri.conf.json ($VERSION) 与 package.json ($PKG_VERSION) 版本号不一致"
            exit 1
          fi
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::tag $TAG 与版本号 v$VERSION 不一致，请先同步 tauri.conf.json 与 package.json"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: 生成发布配置
        env:
          MOLING_UPDATE_REPO: ${{ github.repository }}
        run: pnpm release:config

      # 私钥不入库：TAURI_SIGNING_PRIVATE_KEY 存 Secret；口令同理。
      # 缺失时构建会直接失败，而不是产出一个装不上更新的包。
      - name: 构建带签名的更新制品
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --config src-tauri/tauri.release.conf.json --bundles nsis

      # GitHub 会悄悄剔除非 ASCII 资产名（墨灵_1.0.0_x64-setup.exe 被存成 _1.0.0_x64-setup.exe），
      # 而 latest.json 记录的是本地文件名，导致客户端更新下载 404。清单生成前统一改为 ASCII。
      - name: 规范化更新包文件名
        run: |
          cd src-tauri/target/release/bundle/nsis
          shopt -s nullglob
          # 只认含当前版本号的产物，防止旧构建残留被当成本次更新包
          zips=( *"${VERSION}"*.nsis.zip )
          exes=( *"${VERSION}"*-setup.exe )
          if [ ${#zips[@]} -gt 0 ]; then
            if [ ${#zips[@]} -gt 1 ]; then
              echo "::error::发现多个更新包（${zips[*]}），请清理 bundle 目录后重试"
              exit 1
            fi
            src="${zips[0]}"
            dst="moling_${VERSION}_x64-setup.nsis.zip"
          elif [ ${#exes[@]} -gt 0 ]; then
            if [ ${#exes[@]} -gt 1 ]; then
              echo "::error::发现多个安装包（${exes[*]}），请清理 bundle 目录后重试"
              exit 1
            fi
            src="${exes[0]}"
            dst="moling_${VERSION}_x64-setup.exe"
          else
            echo "::error::目录中没有含版本 $VERSION 的更新包（*.nsis.zip 或 *-setup.exe）"
            exit 1
          fi
          if [ ! -f "$src.sig" ]; then
            echo "::error::缺少签名文件 $src.sig"
            exit 1
          fi
          if [ "$src" != "$dst" ]; then
            mv "$src" "$dst"
            mv "$src.sig" "$dst.sig"
            echo "已重命名：$src → $dst"
          fi

      - name: 生成更新清单
        run: |
          NOTES=$(git tag -l --format='%(contents)' "${{ github.event.inputs.tag || github.ref_name }}" | sed '/^$/d')
          if [ -z "$NOTES" ]; then NOTES="墨灵 $VERSION"; fi
          node scripts/make-latest-json.mjs --notes "$NOTES"

      - name: 建立 Release（空）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，直接追加资产"
          else
            gh release create "$TAG" --title "墨灵 $VERSION" --notes "版本 $VERSION"
          fi

      - name: 上传安装包与签名
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          cd src-tauri/target/release/bundle/nsis
          # Tauri 对 NSIS 的更新包可能是 *.nsis.zip，也可能是直接签名的 *-setup.exe，两种都传
          shopt -s nullglob
          files=( *.nsis.zip *.nsis.zip.sig *-setup.exe *-setup.exe.sig )
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::目录中没有可上传的安装包或签名"
            exit 1
          fi
          printf '待上传: %s\n' "${files[@]}"
          gh release upload "$TAG" "${files[@]}" --clobber

      # 清单最后上传：此前即使中断，存量客户端仍只看到上一版，不会 404
      - name: 发布更新清单（最后一步）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          gh release upload "$TAG" src-tauri/target/release/bundle/nsis/latest.json --clobber
          echo "已发布 $TAG，清单地址："
          echo "https://github.com/${{ github.repository }}/releases/latest/download/latest.json"
