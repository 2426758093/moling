name: Release

# 打 tag（v1.0.1 形式）触发；也可手动指定已存在的 tag 重跑。
# 发布顺序：先建空 Release → 传安装包与签名 → 最后传 latest.json。
# 反过来会出现「清单指向 404」，所有客户端检查更新立即报错。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: 已存在的 tag（形如 v1.0.1）
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 门禁与打包并行：三道工序互不依赖，任何一道失败都不会进入 publish。
  # 门禁（约 3 分钟）藏在打包（约 4 分钟）后面，不再纯等待。
  frontend-gate:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test

  rust-gate:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          # 默认 build-warnings 为 deny；保持与本地「仅 clippy -D warnings」一致的语义，
          # 避免 cargo test 构建期警告意外变红。
          build-warnings: ""
      # 缓存 key 必须与打包 job 区分：门禁编的是 debug，打包编的是 release，
      # 共用一个 key 会互相覆盖，命中率反而不稳定。
      - name: Rust 构建缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: tauri-gate
      # 发布前再跑一遍门禁：ci.yml 只在 main 上触发，tag 可能打在未过检的提交上
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit@0.22.2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo audit

  build:
    runs-on: windows-latest
    # 缓存全冷时（依赖变更、缓存被淘汰）仍可能接近一小时，保留 120 分钟上限。
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # 附注 tag 的消息要作为更新说明，必须抓 tag 对象；否则 %(contents) 只剩提交标题
          fetch-tags: true

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          build-warnings: ""

      - run: pnpm install --frozen-lockfile

      # Rust 依赖与 target 缓存：缓存命中后只重编应用自身。
      - name: Rust 构建缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: tauri-release

      - name: 校验 tag 与版本号一致
        env:
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          VERSION=$(node -e "console.log(JSON.parse(require('fs').readFileSync('src-tauri/tauri.conf.json','utf8')).version)")
          PKG_VERSION=$(node -e "console.log(JSON.parse(require('fs').readFileSync('package.json','utf8')).version)")
          echo "tag=$TAG version=$VERSION package.json=$PKG_VERSION"
          if [ "$VERSION" != "$PKG_VERSION" ]; then
            echo "::error::tauri.conf.json ($VERSION) 与 package.json ($PKG_VERSION) 版本号不一致"
            exit 1
          fi
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::tag $TAG 与版本号 v$VERSION 不一致，请先同步 tauri.conf.json 与 package.json"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: 生成发布配置
        env:
          MOLING_UPDATE_REPO: ${{ github.repository }}
        run: pnpm release:config

      # 私钥不入库：TAURI_SIGNING_PRIVATE_KEY 存 Secret；口令同理。
      # 缺失时构建会直接失败，而不是产出一个装不上更新的包。
      - name: 构建带签名的更新制品
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --config src-tauri/tauri.release.conf.json --bundles nsis

      # GitHub 会悄悄剔除非 ASCII 资产名（墨灵_1.0.0_x64-setup.exe 被存成 _1.0.0_x64-setup.exe），
      # 而 latest.json 记录的是本地文件名，导致客户端更新下载 404。清单生成前统一改为 ASCII。
      - name: 规范化更新包文件名
        run: |
          cd src-tauri/target/release/bundle/nsis
          shopt -s nullglob
          # 只认含当前版本号的产物，防止旧构建残留被当成本次更新包
          zips=( *"${VERSION}"*.nsis.zip )
          exes=( *"${VERSION}"*-setup.exe )
          if [ ${#zips[@]} -gt 0 ]; then
            if [ ${#zips[@]} -gt 1 ]; then
              echo "::error::发现多个更新包（${zips[*]}），请清理 bundle 目录后重试"
              exit 1
            fi
            src="${zips[0]}"
            dst="moling_${VERSION}_x64-setup.nsis.zip"
          elif [ ${#exes[@]} -gt 0 ]; then
            if [ ${#exes[@]} -gt 1 ]; then
              echo "::error::发现多个安装包（${exes[*]}），请清理 bundle 目录后重试"
              exit 1
            fi
            src="${exes[0]}"
            dst="moling_${VERSION}_x64-setup.exe"
          else
            echo "::error::目录中没有含版本 $VERSION 的更新包（*.nsis.zip 或 *-setup.exe）"
            exit 1
          fi
          if [ ! -f "$src.sig" ]; then
            echo "::error::缺少签名文件 $src.sig"
            exit 1
          fi
          if [ "$src" != "$dst" ]; then
            mv "$src" "$dst"
            mv "$src.sig" "$dst.sig"
            echo "已重命名：$src → $dst"
          fi

      - name: 生成更新清单
        run: |
          NOTES=$(git tag -l --format='%(contents)' "${{ github.event.inputs.tag || github.ref_name }}" | sed '/^$/d')
          if [ -z "$NOTES" ]; then NOTES="墨灵 $VERSION"; fi
          node scripts/make-latest-json.mjs --notes "$NOTES"

      # 产物跨 job 传递：publish 不重新构建，只负责上传
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          retention-days: 3
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.nsis.zip
            src-tauri/target/release/bundle/nsis/*.nsis.zip.sig
            src-tauri/target/release/bundle/nsis/*-setup.exe
            src-tauri/target/release/bundle/nsis/*-setup.exe.sig
            src-tauri/target/release/bundle/nsis/latest.json

  # 三道工序全过才发布；任何一道失败，Release 页面上都不会出现半成品
  publish:
    needs: [frontend-gate, rust-gate, build]
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist-assets

      - name: 建立 Release（空）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在，直接追加资产"
          else
            gh release create "$TAG" --title "墨灵 ${TAG#v}" --notes "版本 ${TAG#v}"
          fi

      - name: 上传安装包与签名
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          cd dist-assets
          # Tauri 对 NSIS 的更新包可能是 *.nsis.zip，也可能是直接签名的 *-setup.exe，两种都传
          shopt -s nullglob
          files=( *.nsis.zip *.nsis.zip.sig *-setup.exe *-setup.exe.sig )
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::目录中没有可上传的安装包或签名"
            exit 1
          fi
          printf '待上传: %s\n' "${files[@]}"
          gh release upload "$TAG" "${files[@]}" --clobber

      # 清单最后上传：此前即使中断，存量客户端仍只看到上一版，不会 404
      - name: 发布更新清单（最后一步）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          gh release upload "$TAG" dist-assets/latest.json --clobber
          echo "已发布 $TAG，清单地址："
          echo "https://github.com/${{ github.repository }}/releases/latest/download/latest.json"
